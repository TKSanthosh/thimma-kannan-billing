<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#15803d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f5132;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fef08a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <!-- Vilakku / Diya Lamp Base -->
  <path d="M128 340 C128 420 384 420 384 340 C384 330 128 330 128 340 Z" fill="#d97706" stroke="#b45309" stroke-width="8"/>
  <ellipse cx="256" cy="330" rx="128" ry="24" fill="#fbbf24" stroke="#d97706" stroke-width="6"/>
  <!-- Lamp Flame -->
  <path d="M256 120 C230 180 200 240 200 290 C200 320 225 335 256 335 C287 335 312 320 312 290 C312 240 282 180 256 120 Z" fill="url(#flame)"/>
  <!-- Inner Bright Flame -->
  <path d="M256 180 C242 220 226 260 226 295 C226 312 239 324 256 324 C273 324 286 312 286 295 C286 260 270 220 256 180 Z" fill="#ffffff" opacity="0.8"/>
  <!-- Text 'தி.க' in Tamil -->
  <text x="256" y="460" font-family="'Noto Sans Tamil', sans-serif" font-size="72" font-weight="900" fill="#fef08a" text-anchor="middle">தி.க</text>
</svg>
